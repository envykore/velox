# builds binaries for windows, mac, linux on every release tag

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: velox.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: velox

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: velox

    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          dst="velox-${{ matrix.target }}"
          [[ "${{ matrix.binary }}" == *.exe ]] && dst="${dst}.exe"
          mv "$src" "$dst"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velox-${{ matrix.target }}
          path: velox-${{ matrix.target }}*

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: velox-*
          generate_release_notes: true